name: Update company data

# Nightly: fetch valuation inputs (EPS, free cash flow, dividends, beta, multiples) from Yahoo Finance into
# public/data/fundamentals.json. The deploy workflow runs after this one, so the site picks up the new file.
on:
  schedule:
    - cron: '30 21 * * *'   # 05:30 Hong Kong time, after the US close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fundamentals
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the parser
        run: node scripts/fundamentals/parse.test.mjs
      - name: Fetch company data
        run: node scripts/fundamentals/fetch.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- public/data/fundamentals.json; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/fundamentals.json
          git commit -m "Update company data $(date -u +%F)"
          git push
